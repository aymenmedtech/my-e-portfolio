<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroData Sim Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AeroData Sim</h1>
            <p><a href="projects.html">← Back to projects</a></p>
        </header>

        <section id="blog-content"></section>
    </div>

    <script>
        function appendTextParagraph(container, text) {
            let paragraphLines = [];

            function flushParagraph() {
                if (paragraphLines.length === 0) {
                    return;
                }

                const paragraph = document.createElement('p');
                paragraph.textContent = paragraphLines.join(' ');
                container.appendChild(paragraph);
                paragraphLines = [];
            }

            text.split('\n').forEach((line) => {
                const cleanedLine = line.trim();

                if (!cleanedLine) {
                    flushParagraph();
                    return;
                }

                const headingMatch = cleanedLine.match(/^(#{3,4})\s+(.+)$/);
                if (headingMatch) {
                    flushParagraph();
                    const subtitle = document.createElement(headingMatch[1].length === 4 ? 'h4' : 'h3');
                    subtitle.textContent = headingMatch[2];
                    container.appendChild(subtitle);
                    return;
                }

                paragraphLines.push(cleanedLine);
            });

            flushParagraph();
        }

        async function loadBlog() {
            try {
                const response = await fetch('./aerodata-sim-blog.json');
                const data = await response.json();
                const container = document.getElementById('blog-content');

                Object.entries(data.vlog).forEach(([heading, text]) => {
                    const section = document.createElement('section');
                    const headingElement = document.createElement('h2');
                    headingElement.textContent = heading.replace(/([A-Z])/g, ' $1').trim();
                    section.appendChild(headingElement);
                    appendTextParagraph(section, text);
                    container.appendChild(section);
                });
            } catch (error) {
                console.error('Failed to load AeroData Sim blog:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlog);
    </script>
</body>
</html>
